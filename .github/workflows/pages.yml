name: Build & deploy to GitHub Pages

# Builds the WebXR player/demo and publishes it to GitHub Pages, served at
# https://neuhaus.github.io/Valiant360/.
#
# WebXR only works in a secure context, so the HTTPS origin provided by Pages
# is what makes the VR headset demo testable on a Meta Quest. The workflow
# lives on webxr-support because that is where the WebXR support is, and it
# must be present on the pushed branch for the push trigger below to fire.
#
# Requires: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

on:
  push:
    branches: ["webxr-support"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node.js (and npx) is preinstalled on ubuntu-latest; the build uses it
      # to compile the LESS stylesheet.
      - name: Build and assemble the site
        run: ./scripts/build-site.sh

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
